# Single effective configuration for planning, preview and runtime nodes.
# Distances: metres; angles: degrees only for keys ending in _deg; time: seconds.
# Ratios use 0..1. Reload nodes and regenerate preview after effective changes.
# Collision radius is body_radius_m + planning_padding_m, never the virtual disk.
# Area tolerance is bounded to 0..0.001; it is not a coverage-loss trade-off knob.
# min_trim_segment_length_m is independent of stripe_spacing_m.
# Hardware reflex settings are NOT changed by this configuration.
geometry:
  body_radius_m: 0.18
  planning_padding_m: 0.02
  coverage_disk_radius_m: 0.25
motion:
  linear_m_s: 0.12
  angular_rad_s: 0.4
  linear_accel_m_s2: 0.15
  angular_accel_rad_s2: 0.6
  manual_forward_m_s: 0.25
  manual_reverse_m_s: 0.15
  manual_angular_rad_s: 0.5
planning:
  stripe_spacing_m: 0.35
  min_trim_segment_length_m: 0.35
  area_tie_tolerance_ratio: 0.001
  max_segment_length_m: 2.0
  stationary_target_length_m: 0.01
  alignment: auto
  manual_angle_deg: 0.0
  angle_search_step_deg: 0.5
  min_wall_length_m: 1.0
  wall_cluster_tolerance_deg: 3.0
  min_wall_support_m: 2.0
  min_wall_support_ratio: 0.4
  offset_step_m: null  # Use the map resolution unless explicitly overridden.
boundary:
  enabled: true
  scope: outer_and_obstacles
  direction: auto
completion:
  target_coverage_ratio: 0.9
resweep:
  enabled: true
  max_rounds: 3
  minimum_gain_m2: 0.01
  max_targets: 200
localization:
  position_sigma_m: 0.1
  heading_sigma_deg: 10.0
  settle_s: 2.0
  min_endpoints: 60
  matched_ratio: 0.65
  match_distance_m: 0.15
  amcl_max_age_s: 2.0
  jump_translation_m: 0.1
  jump_rotation_deg: 10.0
  min_scan_range_m: 0.2
  max_scan_range_m: 12.0
  max_endpoints: 240
  tf_delay_s: 0.1
  pose_rate_hz: 10.0
  tf_cache_s: 10.0
  nomotion_update_period_s: 1.0
health:
  scan_age_s: 0.5
  odom_age_s: 0.5
  hazard_age_s: 0.5
  wheel_age_s: 2.0
  dock_age_s: 2.0
  battery_age_s: 15.0
  command_age_s: 0.5
  lease_age_s: 0.5
  gate_age_s: 0.5
  meter_age_s: 2.0
  stop_linear_m_s: 0.015
  stop_angular_rad_s: 0.03
  stop_burst_s: 0.15
  gate_rate_hz: 20.0
  graph_period_s: 0.5
  reset_grace_s: 2.0
  future_stamp_tolerance_s: 0.1
  shutdown_stop_messages: 3
measurement:
  max_sample_gap_s: 0.3
  translation_slack_m: 0.05
  rotation_slack_deg: 5.0
  publish_period_s: 0.5
battery:
  start_ratio: 0.3
  return_ratio: 0.25
  critical_ratio: 0.15
deadlines:
  mission_s: 1800.0
  planning_s: 5.0
  target_s: 60.0
  return_s: 120.0
  undock_s: 60.0
  dock_s: 90.0
  action_accept_s: 5.0
  action_cancel_s: 2.0
  no_motion_s: 15.0
  no_coverage_gain_s: 120.0
  prepare_s: 15.0
  dock_confirmation_s: 2.0
  native_ownership_s: 5.0
  dock_visibility_s: 5.0
  dwell_s: 0.7
recovery:
  target_attempts: 2
  blockage_radius_m: 0.25
  bump_repeat_radius_m: 0.3
  bump_max_s: 5.0
  bump_clear_s: 1.0
  endpoint_tolerance_m: 0.1
  plan_endpoint_tolerance_m: 0.05
  short_test_max_m: 2.0
  planner_start_tolerance_m: 0.15
  movement_translation_m: 0.03
  movement_rotation_rad: 0.05
  bump_max_repeats: 1
runtime:
  map_yaml: /home/create3-pi/create3_ws/maps/room_20260923_1338/map.yaml
  output_dir: /home/create3-pi/create3_ws/coverage_reports
  dock_file: ''
  map_frame: map
  odom_frame: odom
  base_frame: base_footprint
visualization:
  period_s: 0.5
nav2:
  amcl:
    ros__parameters:
      use_sim_time: false
      base_frame_id: base_footprint
      odom_frame_id: odom
      global_frame_id: map
      scan_topic: /scan
      robot_model_type: nav2_amcl::DifferentialMotionModel
      laser_model_type: likelihood_field
      laser_min_range: 0.2
      laser_max_range: 12.0
      max_beams: 120
      min_particles: 500
      max_particles: 2000
      update_min_d: 0.05
      update_min_a: 0.1
      transform_tolerance: 0.5
      tf_broadcast: true
      set_initial_pose: false
      always_reset_initial_pose: true
      save_pose_rate: -1.0
  map_server:
    ros__parameters:
      use_sim_time: false
      frame_id: map
      topic_name: map
  planner_server:
    ros__parameters:
      use_sim_time: false
      expected_planner_frequency: 1.0
      planner_plugins:
      - GridBased
      GridBased:
        plugin: nav2_navfn_planner::NavfnPlanner
        tolerance: 0.05
        use_astar: true
        allow_unknown: false
  controller_server:
    ros__parameters:
      use_sim_time: false
      controller_frequency: 20.0
      enable_stamped_cmd_vel: false
      min_x_velocity_threshold: 0.001
      min_y_velocity_threshold: 0.001
      min_theta_velocity_threshold: 0.001
      failure_tolerance: 0.0
      odom_topic: /odom
      progress_checker_plugins:
      - progress_checker
      goal_checker_plugins:
      - goal_checker
      controller_plugins:
      - FollowPath
      progress_checker:
        plugin: nav2_controller::PoseProgressChecker
        required_movement_radius: 0.05
        required_movement_angle: 0.1
        movement_time_allowance: 15.0
      goal_checker:
        plugin: nav2_controller::SimpleGoalChecker
        xy_goal_tolerance: 0.05
        yaw_goal_tolerance: 0.1
        stateful: true
      FollowPath:
        plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
        desired_linear_vel: 0.12
        lookahead_dist: 0.2
        use_velocity_scaled_lookahead_dist: false
        rotate_to_heading_angular_vel: 0.4
        use_rotate_to_heading: true
        rotate_to_heading_min_angle: 0.35
        max_angular_accel: 0.6
        allow_reversing: false
        use_collision_detection: true
        max_allowed_time_to_collision_up_to_carrot: 1.0
        use_regulated_linear_velocity_scaling: true
        use_cost_regulated_linear_velocity_scaling: true
        regulated_linear_scaling_min_speed: 0.03
        min_approach_linear_velocity: 0.02
        approach_velocity_scaling_dist: 0.3
        cost_scaling_dist: 0.3
        cost_scaling_gain: 1.0
        inflation_cost_scaling_factor: 5.0
        max_robot_pose_search_dist: 0.5
  local_costmap:
    local_costmap:
      ros__parameters:
        use_sim_time: false
        global_frame: odom
        robot_base_frame: base_footprint
        update_frequency: 10.0
        publish_frequency: 2.0
        rolling_window: true
        width: 3
        height: 3
        resolution: 0.05
        robot_radius: 0.2
        footprint_padding: 0.0
        transform_tolerance: 0.3
        track_unknown_space: true
        always_send_full_costmap: true
        plugins:
        - obstacle_layer
        - inflation_layer
        obstacle_layer:
          plugin: nav2_costmap_2d::ObstacleLayer
          enabled: true
          observation_sources: scan
          scan:
            topic: /scan
            data_type: LaserScan
            clearing: true
            marking: true
            obstacle_max_range: 3.0
            obstacle_min_range: 0.2
            raytrace_max_range: 3.5
            raytrace_min_range: 0.2
            inf_is_valid: false
            expected_update_rate: 0.2
        inflation_layer:
          plugin: nav2_costmap_2d::InflationLayer
          inflation_radius: 0.35
          cost_scaling_factor: 5.0
  global_costmap:
    global_costmap:
      ros__parameters:
        use_sim_time: false
        global_frame: map
        robot_base_frame: base_footprint
        update_frequency: 2.0
        publish_frequency: 1.0
        resolution: 0.05
        robot_radius: 0.2
        footprint_padding: 0.0
        transform_tolerance: 0.3
        track_unknown_space: true
        always_send_full_costmap: true
        plugins:
        - static_layer
        - obstacle_layer
        - inflation_layer
        static_layer:
          plugin: nav2_costmap_2d::StaticLayer
          map_subscribe_transient_local: true
        obstacle_layer:
          plugin: nav2_costmap_2d::ObstacleLayer
          observation_sources: scan
          scan:
            topic: /scan
            data_type: LaserScan
            clearing: true
            marking: true
            obstacle_max_range: 3.0
            obstacle_min_range: 0.2
            raytrace_max_range: 3.5
            raytrace_min_range: 0.2
            inf_is_valid: false
            expected_update_rate: 0.2
        inflation_layer:
          plugin: nav2_costmap_2d::InflationLayer
          inflation_radius: 0.35
          cost_scaling_factor: 5.0
