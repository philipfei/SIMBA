format_version: 2
platforms:
  pc: {os: Ubuntu 24.04, architecture: amd64, ros: jazzy, python: "3.12"}
  pi: {os: Ubuntu 24.04, architecture: arm64, ros: jazzy, python: "3.12"}
policy:
  install: Use Ubuntu and ROS apt packages plus rosdep; do not pip-overwrite system ROS packages.
  verification: Recheck installed versions and Nav2 interfaces on each host before robot deployment.
ros_apt:
  common:
    - ros-jazzy-rmw-cyclonedds-cpp
    - ros-jazzy-irobot-create-msgs
    - ros-jazzy-navigation2
    - ros-jazzy-nav2-bringup
    - ros-jazzy-slam-toolbox
  pi:
    - ros-jazzy-rplidar-ros
  pc:
    - ros-jazzy-rviz2
ubuntu_apt:
  common: [git, python3-colcon-common-extensions, python3-numpy, python3-pil, python3-yaml, python3-pytest]
  pc: [python3-matplotlib]
historical_pi_observations:
  ros-jazzy-navigation2: 1.3.13-1noble.20260907.041002
  ros-jazzy-nav2-bringup: 1.3.13-1noble.20260907.050450
  ros-jazzy-slam-toolbox: 2.8.5-1noble.20260907.044142
  ros-jazzy-rplidar-ros: 2.1.0-4noble.20260902.175214
  ros-jazzy-irobot-create-msgs: 3.0.0-2noble.20260612.080719
notes:
  - Historical versions are evidence only and must be rechecked.
  - rplidar_ros is installed from apt and is not a third workspace package.
  - Hardware packages are runtime dependencies; pure coverage tests and preview do not require hardware.
